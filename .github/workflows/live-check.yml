name: Live check

# Runs every recipe against the real sites once a day. When a provider stops
# returning streams, opens (or updates) an issue with the output.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Run the live check
        id: live
        run: |
          set +e
          dart run bin/pack.dart live | tee live.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update the issue when it fails
        if: steps.live.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'The live check failed on %s.\n\n```\n%s\n```\n' "$(date -u +%F)" "$(cat live.txt)")"
          existing="$(gh issue list --state open --search 'Live check failing in:title' --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Live check failing" --body "$body"
          fi
      - name: Close the issue when it passes
        if: steps.live.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --state open --search 'Live check failing in:title' --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The live check passes again."
          fi
