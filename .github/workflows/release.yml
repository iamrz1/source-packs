name: Release

# Conventional commits drive the version:
#   1. Every push to main updates a standing release PR (version bump and
#      CHANGELOG.md): feat -> minor, fix -> patch, "BREAKING CHANGE" -> major.
#   2. Merging that PR creates a GitHub release and a tag.
#   3. This workflow then builds pack.json for that tag and attaches pack.json
#      and pack.json.sha256 to the release.
on:
  push:
    branches: [main]
  # Rebuild the assets of an existing tag (e.g. when the publish job failed
  # after release-please had already tagged).
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to build and attach the pack to (e.g. v1.2.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: tag
        run: |
          echo "tag=${{ github.event.inputs.tag_name || needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test
      - name: Build the pack
        run: |
          dart run bin/pack.dart build --version "${{ steps.tag.outputs.tag }}" --out dist
          (cd dist && sha256sum pack.json > pack.json.sha256)
      - name: Attach the pack to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            dist/pack.json dist/pack.json.sha256 --clobber
