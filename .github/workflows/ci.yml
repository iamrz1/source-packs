name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze
      - run: dart test
      - name: Validate the recipes
        run: dart run bin/pack.dart check
      - name: Build the pack
        run: dart run bin/pack.dart build --version 0.0.0 --out dist
